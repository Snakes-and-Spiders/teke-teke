let seed=1;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function turnTo(a,b,s){const d=angDiff(b,a);return a+Math.max(-s,Math.min(s,d));}

/* ---------------- AUDIO ---------------- */
let AC=null,master=null,noiseBuf=null,ambNodes=[],ambGain=null,currentAmb='none',lastHurt=0;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  for(const f of[55,57.6]){const o=AC.createOscillator();o.frequency.value=f;const g=AC.createGain();g.gain.value=0.035;o.connect(g);g.connect(master);o.start();}
  setAmbience(currentAmb);
}
function noise(dur,type,freq,q,gain,when=0){
  if(!AC)return;const t=AC.currentTime+when;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
}
function tone(f,dur,type,gain,when=0,slide=0){
  if(!AC)return;const t=AC.currentTime+when;
  const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function sfxClack(loud,when=0){noise(0.05,'bandpass',1700+Math.random()*700,6,loud?0.55:0.13,when);noise(0.04,'lowpass',280,1,loud?0.45:0.1,when);}
function sfxScream(p=1){
  if(!AC)return;const t=AC.currentTime,f0=520*p;
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,t);
  o.frequency.linearRampToValueAtTime(f0*1.7,t+0.15);o.frequency.linearRampToValueAtTime(f0*1.4,t+0.8);o.frequency.linearRampToValueAtTime(f0*0.9,t+1.2);
  const lfo=AC.createOscillator();lfo.frequency.value=7;const lg=AC.createGain();lg.gain.value=f0*0.06;lfo.connect(lg);lg.connect(o.frequency);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1400*p;bp.Q.value=1.5;
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.05);g.gain.setValueAtTime(0.22,t+0.8);g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
  o.connect(bp);bp.connect(g);g.connect(master);o.start(t);lfo.start(t);o.stop(t+1.3);lfo.stop(t+1.3);
  noise(1.0,'bandpass',2500*p,2,0.05);
}
function sfxShout(){tone(190,0.12,'square',0.06,0,150);tone(220,0.2,'square',0.06,0.14,160);}
function sfxSlash(){noise(0.3,'highpass',2000,0.7,0.45);tone(80,0.35,'sine',0.7,0,30);noise(0.5,'lowpass',400,1,0.5,0.04);}
function sfxWhoosh(){noise(0.15,'bandpass',3000,1,0.15);}
function sfxBell(g=1,alt=false){tone(alt?1180:1110,0.5,'triangle',0.12*g);tone(alt?2360:2220,0.3,'sine',0.04*g);}
function sfxHeart(){tone(60,0.18,'sine',0.6);tone(52,0.2,'sine',0.45,0.25);}
function sfxHurt(){const n=performance.now();if(n-lastHurt<250)return;lastHurt=n;noise(0.15,'lowpass',800,1,0.25);tone(140,0.15,'sawtooth',0.05,0,90);}
function sfxHorn(){tone(277,1.8,'square',0.07);tone(330,1.8,'square',0.07);tone(415,1.8,'sawtooth',0.03);}
function sfxBrake(){tone(3200,1.5,'sawtooth',0.035,0,2500);noise(1.5,'highpass',4000,0.5,0.15);}
function sfxFlare(){noise(0.4,'bandpass',1200,0.7,0.3);tone(400,0.25,'square',0.05,0,100);}
function sfxGun(){noise(0.12,'lowpass',1800,0.7,0.6);tone(90,0.15,'square',0.2,0,40);noise(0.5,'bandpass',300,0.5,0.15,0.02);}
function sfxClang(){tone(1800,0.4,'triangle',0.15);tone(2700,0.3,'sine',0.08);noise(0.1,'highpass',4000,1,0.3);}
function sfxLaugh(){for(let i=0;i<7;i++){tone(160+Math.random()*70,0.08,'sawtooth',0.05,i*0.14);noise(0.06,'bandpass',900,2,0.04,i*0.14);}}
function sfxPaper(){noise(0.3,'highpass',3000,0.5,0.15);}
function sfxSiren(){tone(700,1.2,'sine',0.04,0,950);tone(950,1.2,'sine',0.04,1.2,700);}
function sfxSpark(){noise(0.5,'highpass',2500,1,0.35);tone(120,0.6,'sawtooth',0.08,0,50);}
function setAmbience(name){
  currentAmb=name;if(!AC)return;
  ambNodes.forEach(n=>{try{n.stop();}catch(e){}});ambNodes=[];
  if(ambGain)ambGain.disconnect();ambGain=AC.createGain();ambGain.gain.value=1;ambGain.connect(master);
  const loopNoise=(type,f,q,g)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
    const gg=AC.createGain();gg.gain.value=g;s.connect(fl);fl.connect(gg);gg.connect(ambGain);s.start();ambNodes.push(s);return fl;};
  if(name==='wind'){const fl=loopNoise('bandpass',500,0.6,0.16);const l=AC.createOscillator();l.frequency.value=0.13;
    const lg=AC.createGain();lg.gain.value=250;l.connect(lg);lg.connect(fl.frequency);l.start();ambNodes.push(l);loopNoise('lowpass',120,1,0.14);}
  if(name==='hum'){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=60;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=180;
    const g=AC.createGain();g.gain.value=0.035;o.connect(f);f.connect(g);g.connect(ambGain);o.start();ambNodes.push(o);loopNoise('lowpass',300,1,0.05);}
  if(name==='train'){loopNoise('lowpass',140,1,0.5);loopNoise('bandpass',800,0.5,0.03);}
  if(name==='city'){const fl=loopNoise('bandpass',450,0.6,0.1);const l=AC.createOscillator();l.frequency.value=0.09;
    const lg=AC.createGain();lg.gain.value=200;l.connect(lg);lg.connect(fl.frequency);l.start();ambNodes.push(l);loopNoise('lowpass',180,1,0.12);}
}

/* ---------------- MAP ---------------- */
// 0 floor, 1 wall, 2 tree, 3 track, 4 seat, 5 window, 6 desk/console, 7 door, 8 wood/rug, 9 void
// 10 sidewalk/gravel, 11 crate, 12 water
const SOLID=[0,1,1,0,1,1,1,0,0,1,0,1,1], OPAQUE=[0,1,1,0,0,1,0,0,0,1,0,1,0];
let W=1,H=1,map=new Uint8Array(1),tmpF=null,distP=null;
function newMap(w,h,t){W=w;H=h;map=new Uint8Array(w*h).fill(t);tmpF=new Int16Array(w*h);distP=new Int16Array(w*h);}
function T(x,y){if(x<0||y<0||x>=W||y>=H)return 1;return map[y*W+x];}
function setT(x,y,t){if(x>=0&&y>=0&&x<W&&y<H)map[y*W+x]=t;}
function fill(x,y,w,h,t){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)setT(i,j,t);}
function solid(x,y){return SOLID[T(x,y)];}
function opaque(x,y){return OPAQUE[T(x,y)];}
function los(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)*4);
  for(let i=1;i<n;i++){const t=i/n;if(opaque(Math.floor(x0+dx*t),Math.floor(y0+dy*t)))return false;}return true;}
function hitsWall(x,y,r){
  for(let j=Math.floor(y-r);j<=Math.floor(y+r);j++)for(let i=Math.floor(x-r);i<=Math.floor(x+r);i++){
    if(solid(i,j)){const cx=Math.max(i,Math.min(x,i+1)),cy=Math.max(j,Math.min(y,j+1));if((x-cx)**2+(y-cy)**2<r*r)return true;}}
  return false;}
function moveEnt(e,dx,dy){
  const steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/0.12)||1;
  for(let s=0;s<steps;s++){e.x+=dx/steps;if(hitsWall(e.x,e.y,e.r))e.x-=dx/steps;e.y+=dy/steps;if(hitsWall(e.x,e.y,e.r))e.y-=dy/steps;}
}
function bfs(sx,sy,out){
  out.fill(-1);if(solid(sx,sy))return;const q=new Int32Array(W*H);let h=0,t=0;const s=sy*W+sx;out[s]=0;q[t++]=s;
  while(h<t){const c=q[h++],cx=c%W,cy=(c/W)|0;
    for(const[ox,oy]of D4){const nx=cx+ox,ny=cy+oy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;
      if(out[n]>=0||solid(nx,ny))continue;out[n]=out[c]+1;q[t++]=n;}}
}
function pathTo(n,tx,ty){
  const sx=Math.floor(n.x),sy=Math.floor(n.y);if(solid(tx,ty))return null;
  bfs(tx,ty,tmpF);if(tmpF[sy*W+sx]<0)return null;
  const p=[];let cx=sx,cy=sy,g=0;
  while(tmpF[cy*W+cx]>0&&g++<3000){let moved=false;
    for(const[ox,oy]of D4){const nx=cx+ox,ny=cy+oy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
      if(tmpF[ny*W+nx]===tmpF[cy*W+cx]-1){cx=nx;cy=ny;p.push([cx,cy]);moved=true;break;}}
    if(!moved)break;}
  return p;
}

function buildL1(){
  newMap(64,46,0);
  fill(0,0,64,1,1);fill(0,45,64,1,1);fill(0,0,1,46,1);fill(63,0,1,46,1);
  L.trackY=21;fill(1,21,62,2,3);

    fill(x,y,w,h,1);fill(x+1,y+1,w-2,h-2,8);let dx,dy;
    if(ds==='s'){dx=x+(w>>1);dy=y+h-1;}else if(ds==='n'){dx=x+(w>>1);dy=y;}else if(ds==='w'){dx=x;dy=y+(h>>1);}else{dx=x+w-1;dy=y+(h>>1);}
    setT(dx,dy,7);

/* ---------------- NPC AI ---------------- */
function followPath(n,spd,dt){
  if(!n.path||!n.path.length)return true;
  const p=n.path[0],cx=p[0]+.5,cy=p[1]+.5,dx=cx-n.x,dy=cy-n.y,d=Math.hypot(dx,dy);
  if(d<0.06){n.path.shift();return !n.path.length;}
  const s=Math.min(d,spd*dt);n.x+=dx/d*s;n.y+=dy/d*s;n.dir=turnTo(n.dir,Math.atan2(dy,dx),dt*8);n.moving=true;return false;
}
function fleeStep(n,spd,dt){
  if(!n.wp){const tx=Math.floor(n.x),ty=Math.floor(n.y);let best=null,bv=distP[ty*W+tx]+0.3;
    for(const[ox,oy]of D8){const nx=tx+ox,ny=ty+oy;if(solid(nx,ny))continue;
      if(ox&&oy&&(solid(tx+ox,ty)||solid(tx,ty+oy)))continue;const dv=distP[ny*W+nx];if(dv<0)continue;
      const v=dv+Math.random()*0.6;if(v>bv){bv=v;best=[nx,ny];}}
    n.cornered=!best;if(!best)return;n.wp=best;}
  const cx=n.wp[0]+.5,cy=n.wp[1]+.5,dx=cx-n.x,dy=cy-n.y,d=Math.hypot(dx,dy);
  if(d<0.06){n.wp=null;return;}
  const s=Math.min(d,spd*dt);n.x+=dx/d*s;n.y+=dy/d*s;n.dir=turnTo(n.dir,Math.atan2(dy,dx),dt*10);n.moving=true;
}
function facePlayer(n,dt,k=5){n.dir=turnTo(n.dir,Math.atan2(P.y-n.y,P.x-n.x),dt*k);}
function inBeam(n,x,y){
  if(!n.flash||n.dead||n.stagger>0)return false;const dx=x-n.x,dy=y-n.y,d=Math.hypot(dx,dy);
  return d<BEAM_R&&d>0.2&&Math.abs(angDiff(Math.atan2(dy,dx),n.dir))<BEAM_A&&los(n.x,n.y,x,y);
}
function detect(n){
  n.active=true;n.aw=1;n.path=null;n.wp=null;n.asleep=false;
  if(n.type==='boss'){if(n.spot&&!n.spotted){n.spotted=true;caption(n.spot,3,'#e8e2d8');}return;}
  if(n.type==='citizen'){n.state=legendLevel()>=1?'freeze':'panic';n.wait=0.9;n.panicT=0;n.screamT=0;n.lost=0;addHeat(1);return;}
  if(n.type==='guard'){
    if(n.police&&!n.target&&legendLevel()>=3&&Math.random()<0.4){n.state='panic';n.lost=0;
      if(!L.copRun){L.copRun=1;caption('An officer drops his gun and runs. The legend is bigger than his badge.',3.5,'#e8b050');}return;}
    n.state='hunt';n.shoutT=0;n.huntT=0;if(n.spot&&!n.spotted){n.spotted=true;caption(n.spot,3,'#e8e2d8');}}
  else{n.state='panic';n.screamT=0;n.seated=false;if(n.spot&&!n.spotted){n.spotted=true;caption(n.spot,3,'#e8e2d8');}}
}
function alertAround(src,rad){
  for(const n of npcs){if(n===src||n.dead||n.active)continue;
    const dd=Math.hypot(n.x-src.x,n.y-src.y);if(dd>rad)continue;
    if(n.type==='citizen'){if(dd<8){n.last={x:src.x,y:src.y};detect(n);}else n.alertT=25;continue;}
    if(n.type==='boss')continue;
    n.alertT=25;n.aw=Math.max(n.aw,0.5);n.asleep=false;
    if(n.type==='guard'||n.type==='target'){n.state='investigate';n.inv=[Math.floor(src.x),Math.floor(src.y)];n.path=null;n.wait=0;}}
}
function makeNoise(x,y,rad){
  for(const n of npcs){if(n.dead||n.active)continue;if(Math.hypot(n.x-x,n.y-y)>rad)continue;
    if(n.type==='boss')continue;
    if(n.type==='citizen'&&legendLevel()>=2){n.last={x,y};detect(n);continue;}
    n.aw=Math.min(0.9,n.aw+0.25);n.asleep=false;
    if(n.type==='guard'||n.type==='target'||n.type==='citizen'){n.state='investigate';n.inv=[Math.floor(x),Math.floor(y)];n.path=null;n.wait=0;}
    else n.dir=turnTo(n.dir,Math.atan2(y-n.y,x-n.x),1);}
}

      else followPath(n,n.run,dt);

    if(n.aw>0.35&&see){facePlayer(n,dt);return;}
    if(n.state==='investigate'){if(!n.path)n.path=pathTo(n,n.inv[0],n.inv[1])||[];
      if(followPath(n,n.run*0.8,dt)){n.state='look';n.wait=4;n.path=null;}return;}
    if(n.state==='look'){n.wait-=dt;n.dir+=Math.sin(n.anim*1.3)*dt*2.5;if(n.wait<=0){n.state='patrol';n.wait=0;n.path=null;}return;}

  },
  citizen(n,dt,see,d){

  },

        n.path=pathTo(n,tx,ty)||[];}

      n.fireT-=dt;if(n.fireT<=0&&see&&d<9){n.fireT=2.1+Math.random()*0.6-(n.maxHp-n.hp)*0.25;shoot(n,5,0.12);}

  }
};
function updNPC(n,dt){
  if(n.dead)return;
  n.anim+=dt;n.moving=false;if(n.alertT>0)n.alertT-=dt;
  if(n.stagger>0){n.stagger-=dt;return;}
  const dx=P.x-n.x,dy=P.y-n.y,d=Math.hypot(dx,dy);let see=false;
  if(!P.dead&&d<16){
    const da=Math.abs(angDiff(Math.atan2(dy,dx),n.dir)),fov=n.type==='passenger'?2.2:1.1;
    let range=P.lit?(n.type==='passenger'?6:n.type==='citizen'?8:9):(P.scuttle?3.8:2.4);
    range*=n.rangeMul;if(n.alertT>0)range*=1.35;if(n.flash&&inBeam(n,P.x,P.y))range=Math.max(range,BEAM_R);
    const touch=n.asleep?0.6:1.0;
    if(n.asleep)range=0;
    if(((da<fov&&d<range)||d<touch)&&los(n.x,n.y,P.x,P.y))see=true;
  }
  if(see){n.aw=Math.min(1.2,n.aw+dt*(d<2.5?3:1.4)*(P.lit?1.6:1)*(n.alertT>0?1.5:1));n.last={x:P.x,y:P.y};n.lost=0;}
  else{n.lost+=dt;if(!n.active)n.aw=Math.max(0,n.aw-dt*0.2);}
  if(n.aw>=1&&!n.active)detect(n);
  BEHAV[n.type](n,dt,see,d);
  if(n.state!=='panic')n.stam=Math.min(n.stamMax,n.stam+dt*0.4);

/* ---------------- COMBAT ---------------- */
function bloodBurst(x,y,a,count=40){
  for(let i=0;i<count;i++){const s=1+Math.random()*4,aa=a+(Math.random()-.5)*2.4;
    parts.push({x,y,vx:Math.cos(aa)*s,vy:Math.sin(aa)*s,z:0.4,vz:1+Math.random()*3});}
}
function trySlash(){
  if(P.slashCD>0)return;P.slashCD=0.45;P.slashAnim=0.25;sfxWhoosh();
  let best=null,bd=1.35;for(const n of npcs){if(n.dead)continue;const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<bd){bd=d;best=n;}}
  if(!best&&L.breaker&&!L.breaker.used&&Math.hypot(L.breaker.x-P.x,L.breaker.y-P.y)<1.4){cutBreaker();return;}
  if(!best)return;
  if(best.type==='boss'){hitBoss(best);return;}
  if(best.type==='passenger'){if(!best.active){detect(best);}if(!L.quarrel){L.quarrel=1;caption('She has no quarrel with them.',2.5,'#b0b8c8');}return;}
  if(best.type==='driver'){if(L.fight)hitDriver(best);return;}
  kill(best);
}
function kill(n){
  n.dead=true;sfxSlash();const a=Math.atan2(n.y-P.y,n.x-P.x);
  corpses.push({x:n.x,y:n.y,a:n.dir,coat:n.coat,hair:n.hair,cap:n.cap,t:0});
  bloodBurst(n.x,n.y,a);hitStop=0.35;shake=0.8;
  if(n.target){captions.length=0;
    if(n.plea)caption((n.short||n.name.split(' ')[0])+': '+n.plea,3.4,'#e8e2d8');
    if(n.reply)caption('Sayo: '+n.reply,3.8,'#e04040');
    if(L.targets.every(t=>t.dead))L.done=true;}
  if(L.dlc){
    G.kills++;
    for(const m of npcs){if(m.dead||m.active||m===n||(m.type!=='citizen'&&m.type!=='guard'))continue;
      const dd=Math.hypot(m.x-n.x,m.y-n.y);if(dd>9)continue;
      const fa=Math.abs(angDiff(Math.atan2(n.y-m.y,n.x-m.x),m.dir));
      if((fa<1.3||dd<3)&&los(m.x,m.y,n.x,n.y)){m.last={x:P.x,y:P.y};m.lost=0;detect(m);}}
    if(n.police&&!n.target)addHeat(2);else if(n.type==='citizen')addHeat(1);
    addLegend(n.type==='boss'?10:n.target?6:n.police?3:2);
  }
}
function hitBoss(n){
  if(n.stagger>0)return;
  if(n.active&&n.variant==='blade'&&n.recover<=0){
    sfxClang();const a=Math.atan2(P.y-n.y,P.x-n.x);P.kx=Math.cos(a)*7;P.ky=Math.sin(a)*7;shake=0.4;n.windup=0.35;
    if(!L.parryHint){L.parryHint=1;caption('Ishida parries. Get clear of his swing, then strike while he recovers.',3.5,'#b0b8c8');}return;}
  if(!n.active)detect(n);

  if(n.hp<=0){kill(n);shake=1.4;return;}
  sfxSlash();bloodBurst(n.x,n.y,Math.atan2(n.y-P.y,n.x-P.x),25);
  n.stagger=0.9;n.recover=0;n.windup=0;shake=1;hitStop=0.2;captions.length=0;
  for(const s of(n.hitLines&&n.hitLines[n.maxHp-n.hp-1])||[])caption(s,3,s.startsWith('Sayo')?'#e04040':'#e8e2d8');
  if(n.variant==='kingpin'){n.moveT=0;L.flickerT=1;
    for(const x of[29,30]){const g=YAK(x,25,{});g.state='investigate';g.inv=[Math.floor(P.x),Math.floor(P.y)];g.alertT=30;}}
}
function shoot(n,pel,spread){
  const err=(n.acc||0.12)*(1+0.35*legendLevel()),base=Math.atan2(P.y-n.y,P.x-n.x);
  for(let k=0;k<pel;k++){const a=base+(Math.random()-.5)*2*err+(pel>1?(k-(pel-1)/2)*spread:0);
    bullets.push({x:n.x+Math.cos(a)*0.4,y:n.y+Math.sin(a)*0.4,vx:Math.cos(a)*16,vy:Math.sin(a)*16,life:1,dmg:n.dmg||10});}

function hitDriver(n){

function computeLit(){

function updPlayer(dt){
  let ix=0,iy=0;
  if(keys.w||keys.arrowup)iy--;if(keys.s||keys.arrowdown)iy++;if(keys.a||keys.arrowleft)ix--;if(keys.d||keys.arrowright)ix++;
  const mv=!!(ix||iy);P.moving=mv;P.scuttle=mv&&!!keys.shift;
  let spd=P.scuttle?6.2:2.6;if(P.burn>0)spd*=0.5;
  if(mv){const l=Math.hypot(ix,iy);ix/=l;iy/=l;P.dir=turnTo(P.dir,Math.atan2(iy,ix),dt*12);
    moveEnt(P,ix*spd*dt,iy*spd*dt);P.anim+=dt*spd*2.2;
    P.clackT-=dt;if(P.clackT<=0){P.clackT=P.scuttle?0.11:0.38;sfxClack(P.scuttle);}
    P.trailD+=spd*dt;if(P.trailD>0.35){P.trailD=0;addDecal(P.x-Math.cos(P.dir)*0.25,P.y-Math.sin(P.dir)*0.25,'trail',P.dir);}
    if(P.scuttle){P.noiseT-=dt;if(P.noiseT<=0){P.noiseT=0.5;makeNoise(P.x,P.y,7.5);}}}
  if(Math.abs(P.kx)+Math.abs(P.ky)>0.1){moveEnt(P,P.kx*dt,P.ky*dt);const k=Math.pow(0.03,dt);P.kx*=k;P.ky*=k;}
  if(P.slashCD>0)P.slashCD-=dt;if(P.slashAnim>0)P.slashAnim-=dt;if(P.senseCD>0)P.senseCD-=dt;if(P.burn>0)P.burn-=dt;
  P.calmT+=dt;if(P.calmT>3&&!P.lit)P.hp=Math.min(100,P.hp+5*dt);
  if(pressed[' ']||pressed.j)trySlash();
  if(pressed.q)sense();
}
function updGame(dt){
  if(pressed.escape||pressed.p){mode='pause';return;}
  updCaptions(dt);
  if(P.dead){P.deathT+=dt;updParts(dt);if(P.deathT>2&&(pressed[' ']||pressed.r||pressed.enter))loadLevel(levelIdx);return;}
  if(hitStop>0){hitStop-=dt;return;}
  const sdt=Math.min(dt,1/30);L.t+=sdt;
  LEVELS[levelIdx].tick(sdt);
  const px=Math.floor(P.x),py=Math.floor(P.y),pt=py*W+px;
  if(pt!==L.lastPT){L.lastPT=pt;bfs(px,py,distP);}
  computeLit();
  updPlayer(sdt);
  if(P.inBeam){damage(30*sdt);P.burn=0.25;}
  for(const n of npcs)updNPC(n,sdt);
  for(let i=flares.length-1;i>=0;i--){const f=flares[i],ox=f.x,oy=f.y;f.x+=f.vx*sdt;f.y+=f.vy*sdt;f.life-=sdt;
    if(Math.hypot(f.x-P.x,f.y-P.y)<0.5){damage(22);P.burn=0.6;fires.push({x:P.x,y:P.y,t:3});flares.splice(i,1);continue;}
    if(solid(Math.floor(f.x),Math.floor(f.y))||f.life<=0){fires.push({x:ox,y:oy,t:4});flares.splice(i,1);}}
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];let hit=false;
    for(let s=0;s<4&&!hit;s++){b.x+=b.vx*sdt/4;b.y+=b.vy*sdt/4;
      if(Math.hypot(b.x-P.x,b.y-P.y)<0.38&&!P.dead){damage(b.dmg);hit=true;bloodBurst(P.x,P.y,Math.atan2(b.vy,b.vx),6);}
      else if(opaque(Math.floor(b.x),Math.floor(b.y)))hit=true;}
    b.life-=sdt;if(hit||b.life<=0)bullets.splice(i,1);}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t-=sdt;if(flashes[i].t<=0)flashes.splice(i,1);}
  if(L.item&&!L.item.got&&Math.hypot(P.x-L.item.x,P.y-L.item.y)<0.8){L.item.got=true;sfxPaper();captions.length=0;
    caption('The list. Five names in the Oyabun\'s own hand. Hamada. Kanemoto. Ishida. Arai. Kuroda.',4,'#e8e2d8');
    caption('A voice in the hall: "Someone\'s in the Oyabun\'s study!"',3,'#e8e2d8');
    for(const n of npcs)if(n.type==='guard'&&!n.dead&&!n.active){n.alertT=40;n.state='investigate';n.inv=[48,10];n.path=null;n.wait=0;}}
  if(L.item&&L.item.got&&!L.done&&P.y>39.5&&Math.abs(P.x-30)<4){L.done=true;captions.length=0;caption('She slips out into the snow with the list.',3,'#b0b8c8');}
  for(let i=fires.length-1;i>=0;i--){const f=fires[i];f.t-=sdt;if(Math.hypot(f.x-P.x,f.y-P.y)<0.9)damage(14*sdt);if(f.t<=0)fires.splice(i,1);}
  updParts(sdt);
  for(const c of corpses)c.t+=sdt;
  if(senseT>0)senseT-=sdt;
  if(shake>0)shake=Math.max(0,shake-sdt*2);
  cam.x+=(P.x-cam.x)*Math.min(1,sdt*6);cam.y+=(P.y-cam.y)*Math.min(1,sdt*6);
  if(L.theme==='train'){cam.y=5.5;}
  if(L.done){L.doneT+=sdt;if(L.doneT>2.5&&!captions.length){

    else if(nx==='DLCEND')playScene(DLC_ENDING,()=>{mode='title';setAmbience('wind');});
    else startChapter(nx);}}
}

function drawTeke(px,py){

  for(const side of[-1,1]){const ph=Math.sin(P.anim+(side>0?0:Math.PI)),hx=12+ph*7,hy=side*(13-Math.abs(ph)*2);

  ctx.fillStyle='#d8d4cb';ctx.beginPath();ctx.ellipse(-3,0,11,10,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(125,8,8,0.9)';ctx.beginPath();ctx.moveTo(-14,-8);
  for(let k=0;k<=8;k++){const yy=-8+k*2,xx=-8-((k*37)%5)-Math.sin(time*2+k)*0.5;ctx.lineTo(xx,yy);}
  ctx.lineTo(-14,8);ctx.closePath();ctx.fill();

function drawDarkness(){
  dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,VW,VH);
  dctx.fillStyle=`rgba(3,4,10,${L.darkNow})`;dctx.fillRect(0,0,VW,VH);
  dctx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,i)=>{const sx=OX+x*TS,sy=OY+y*TS,rr=r*TS;if(sx<-rr||sy<-rr||sx>VW+rr||sy>VH+rr)return;
    const g=dctx.createRadialGradient(sx,sy,0,sx,sy,rr);g.addColorStop(0,`rgba(0,0,0,${i})`);g.addColorStop(0.5,`rgba(0,0,0,${i*0.6})`);g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;dctx.fillRect(sx-rr,sy-rr,rr*2,rr*2);};
  for(const l of frameLights)hole(l.x,l.y,l.r,l.ci);
  hole(P.x,P.y,3.4,0.5);
  const beam=(c,n)=>{const sx=OX+n.x*TS,sy=OY+n.y*TS,rr=BEAM_R*TS;const g=c.createRadialGradient(sx,sy,0,sx,sy,rr);
    g.addColorStop(0,'rgba(255,240,190,0.95)');g.addColorStop(1,'rgba(255,240,190,0)');c.fillStyle=g;
    c.beginPath();c.moveTo(sx,sy);c.arc(sx,sy,rr,n.dir-BEAM_A,n.dir+BEAM_A);c.closePath();c.fill();};
  for(const n of npcs)if(n.flash&&!n.dead&&n.stagger<=0)beam(dctx,n);
  dctx.globalCompositeOperation='source-over';
  ctx.drawImage(dark,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const l of frameLights){if(!l.col)continue;const sx=OX+l.x*TS,sy=OY+l.y*TS,rr=l.r*TS;if(sx<-rr||sy<-rr||sx>VW+rr||sy>VH+rr)continue;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,rr);g.addColorStop(0,`rgba(${l.col},${0.2*l.ci})`);g.addColorStop(1,`rgba(${l.col},0)`);
    ctx.fillStyle=g;ctx.fillRect(sx-rr,sy-rr,rr*2,rr*2);}
  ctx.globalAlpha=0.12;for(const n of npcs)if(n.flash&&!n.dead&&n.stagger<=0)beam(ctx,n);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

const flakes=[];for(let i=0;i<170;i++)flakes.push({x:Math.random(),y:Math.random(),s:1+Math.random()*2.2,v:0.03+Math.random()*0.06,p:Math.random()*6});

function drawSnow(a=0.55){ctx.fillStyle=`rgba(215,225,240,${a})`;for(const f of flakes){ctx.fillRect(((f.x*VW)%VW+VW)%VW,f.y*VH,f.s,f.s);}}

      ctx.beginPath();ctx.moveTo(px+2,py-7);ctx.lineTo(px-4,py+1);ctx.lineTo(px,py+1);ctx.lineTo(px-2,py+7);ctx.lineTo(px+4,py-1);ctx.lineTo(px,py-1);ctx.closePath();ctx.fill();}

  for(const n of npcs){if(n.dead)continue;const px=OX+n.x*TS,py=OY+n.y*TS;if(on(px,py))drawHuman(px,py,n);}

  for(const p of parts){ctx.fillStyle=p.spark?'#ffe080':'#8a0808';circle(OX+p.x*TS,OY+(p.y-p.z*0.5)*TS,p.spark?1.6:2.2);}

      ctx.fillStyle='rgba(255,120,110,0.9)';ctx.fillText('ESCAPE',px,py-TS*1.8);}}

    ctx.fillStyle='rgba(232,192,32,0.9)';ctx.fillText('SPACE — cut the power',OX+L.breaker.x*TS,OY+L.breaker.y*TS-20);}

function drawSense(){
  const a=Math.min(1,senseT)*(0.6+0.4*Math.sin(time*8));
  ctx.textAlign='center';ctx.font='12px "Courier New",monospace';
  for(const n of npcs){if(n.dead||!(n.target||n.type==='guard'))continue;
    let px=OX+n.x*TS,py=OY+n.y*TS;const col=n.target?'255,40,30':'90,140,255';
    if(px>20&&py>20&&px<VW-20&&py<VH-20){ctx.strokeStyle=`rgba(${col},${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,14+(1-senseT%1)*10,0,7);ctx.stroke();
      ctx.fillStyle=`rgba(${col},${a*0.5})`;circle(px,py,10);
      if(n.target){ctx.fillStyle=`rgba(255,120,110,${a})`;ctx.fillText(n.name,px,py-22);}}
    else if(n.target){const ang=Math.atan2(py-VH/2,px-VW/2);const ex=VW/2+Math.cos(ang)*(VW/2-40),ey=VH/2+Math.sin(ang)*(VH/2-40);
      const cx=Math.max(40,Math.min(VW-40,ex)),cy=Math.max(40,Math.min(VH-40,ey));
      ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.fillStyle=`rgba(${col},${a})`;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.fill();ctx.restore();
      ctx.fillStyle=`rgba(255,120,110,${a})`;ctx.fillText(n.name.split(' ')[0],cx,cy+24);}}
}

function updScene(dt){
  const b=scene.beats[scene.i];scene.t+=dt;

  if(pressed[' ']||pressed.enter||pressed.click){if(b.text&&scene.t<full)scene.t=full;else if(!b.dur||scene.t>0.5)nextBeat();return;}

    ctx.font='16px "Courier New",monospace';ctx.fillStyle=`rgba(200,195,190,${Math.min(1,Math.max(0,t-1.2))})`;
    ctx.fillText(`Legend reached: ${LEGEND[(()=>{let k=0;for(let i=0;i<LEGEND.length;i++)if(G.legend>=LEGEND[i][0])k=i;return k;})()][1]}  ·  ${G.kills} taken  ·  ${G.scared} fled in terror`,VW/2,VH*0.38+90);
    ctx.font='14px "Courier New",monospace';ctx.fillStyle='#777';ctx.fillText('press space',VW/2,VH*0.38+130);}},
];
function startChapter(i){G.chapLegend=G.legend;setAmbience(LEVELS[i].meta.amb);playScene(CARDS[i],()=>loadLevel(i));}
function startDLC(at=3){G={legend:0,kills:0,scared:0,chapLegend:0};
  if(at===3){setAmbience('city');playScene(DLC_INTRO,()=>startChapter(3),true);}else startChapter(at);}

/* ---------------- TITLE / OVERLAYS ---------------- */
function drawTitle(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);drawSnow(0.35);ctx.textAlign='center';
  const j=Math.random()<0.05?(Math.random()-.5)*10:0;
  ctx.font='bold 104px Georgia,serif';ctx.fillStyle='#9a0c0c';ctx.fillText('TEKE TEKE',VW/2+j,VH*0.4);
  ctx.font='18px "Courier New",monospace';ctx.fillStyle='#a9a39a';ctx.fillText('テケテケ — a revenge in three chapters',VW/2,VH*0.4+48);
  if(Math.floor(time*1.5)%2){ctx.fillStyle='#ddd';ctx.font='16px "Courier New",monospace';ctx.fillText('press any key',VW/2,VH*0.62);}
  ctx.fillStyle='#e8b050';ctx.font='bold 15px "Courier New",monospace';ctx.fillText('D — DLC: THE KURODA LIST',VW/2,VH*0.62+40);
  ctx.fillStyle='#555';ctx.font='12px "Courier New",monospace';ctx.fillText('headphones recommended  ·  1 / 2 / 3 — jump to chapter  ·  4–9 — jump to a DLC chapter',VW/2,VH-30);
  drawGrain();
}
function drawPause(){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,VW,VH);ctx.textAlign='center';ctx.fillStyle='#ddd';
  ctx.font='bold 30px Georgia,serif';ctx.fillText('PAUSED',VW/2,VH/2-60);ctx.font='15px "Courier New",monospace';
  ['WASD / arrows — crawl','SHIFT — scuttle (fast, but they hear teke teke)','SPACE — strike','Q — sense your prey','Darkness hides you. Light reveals you. Flashlight beams burn.','','ESC — resume'].forEach((s,i)=>ctx.fillText(s,VW/2,VH/2-10+i*24));}
function drawDeath(){const a=Math.min(1,(P.deathT-0.5)/1.5);if(a<=0)return;ctx.fillStyle=`rgba(30,0,0,${a*0.75})`;ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';ctx.globalAlpha=a;ctx.font='bold 44px Georgia,serif';ctx.fillStyle='#b01010';ctx.fillText('THE COLD TAKES HER',VW/2,VH/2-10);
  ctx.font='italic 18px Georgia,serif';ctx.fillStyle='#bbb';ctx.fillText('...but she always crawls back.',VW/2,VH/2+28);
  if(P.deathT>2){ctx.font='14px "Courier New",monospace';ctx.fillText('SPACE — rise again',VW/2,VH/2+70);}ctx.globalAlpha=1;}

/* ---------------- LOOP ---------------- */
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  if(mode==='title'){drawTitle();return;}
  if(mode==='scene'){drawScene();return;}
  drawWorld();drawVignette();drawGrain();drawHUD();
  if(P.dead)drawDeath();
  if(mode==='pause')drawPause();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  try{
    if(mode==='title'){
      const dk=['4','5','6','7','8','9'].findIndex(k=>pressed[k]);
      if(pressed.d)startDLC(3);
      else if(dk>=0)startDLC(3+dk);
      else if(pressed['1']||pressed['2']||pressed['3']){const i=pressed['1']?0:pressed['2']?1:2;startChapter(i);}
      else if(Object.keys(pressed).length){setAmbience('wind');playScene(INTRO,()=>startChapter(0),true);}}
    else if(mode==='scene')updScene(dt);
    else if(mode==='play')updGame(dt);
    else if(mode==='pause'){if(pressed.escape||pressed.p)mode='play';}
    updSnow(dt);render();
  }catch(e){console.error(e);}
  pressed={};requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
